- insert:
    - id: ssh-remote
      name: '@local/ssh-remote'
      config:
        sshPath: ssh
        scpPath: scp
        connectTimeoutSeconds: 10
        defaultTimeoutMs: 120000
        maxTimeoutMs: 600000
        maxOutputBytes: 100000
        maxResultBytes: 200000
        strictHostKeyChecking: accept-new
        extraOptions: []
        maxConcurrency: 4
        maxSessionsPerAgent: 4
        sessionBufferBytes: 262144
